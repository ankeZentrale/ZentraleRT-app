<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Kneipen-App</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f4f4;
}

header{
background:#1f5c4f;
color:white;
padding:15px;
text-align:center;
font-size:26px;
font-weight:bold;
}

.container{
padding:15px;
}

.card{
background:white;
padding:15px;
margin-bottom:10px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.15);
}

button{
width:100%;
padding:14px;
margin-top:6px;
border:none;
border-radius:8px;
background:#1f5c4f;
color:white;
font-size:16px;
}

input,
select{
width:100%;
padding:12px;
margin:5px 0 10px;
border-radius:8px;
border:1px solid #ccc;
}

.table-select{
min-height:52px;
font-size:18px;
}

.hidden{
display:none;
}

.order-row{
display:flex;
justify-content:space-between;
margin:5px 0;
}

.total{
font-size:24px;
font-weight:bold;
color:#1f5c4f;
margin-top:15px;
}

#guestCards{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:10px;
}

.guest-card{
    margin-bottom:0;
    padding:10px;
    font-size:14px;
    cursor:pointer;
}

.menu-grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:8px;
}

.menu-grid button{
    margin-top:0;
    padding:12px 8px;
}
</style>

</head>

<body>

<header>
Bestellungen
</header>

<div class="container">

<div id="guestList">

<div class="card">

<h3>Gast anlegen</h3>

<input
id="guestInfo"
placeholder="Nummer Name (z. B. 37 Hans)">

<select id="tableNumber" class="table-select">
<option>Tisch 1</option>
<option>Tisch 2</option>
<option>Tisch 3</option>
<option>Tisch 4</option>
<option>Tisch 5</option>
<option>Tisch 6 Sofa</option>
<option>Tisch 7 Ecktheke</option>
<option>Tisch 8 Turm oben</option>
<option>Tisch 9 Turm oben</option>
<option>Tisch 10 Turm oben</option>
<option>Tisch 18 Turm unten</option>
<option>Tisch 19 Turm unten</option>
<option>Tisch 20 Turm unten</option>
<option>theke</option>

</select>

<button onclick="createGuest()">
Gast anlegen
</button>

</div>

<div class="card">

<input
id="searchCard"
placeholder="Kartennummer oder Name suchen..."
onkeyup="renderGuests()">

</div>

<h2>Offene Gäste</h2>

<div id="guestCards"></div>

</div>

<div
id="guestView"
class="hidden">

<div class="card">

<h2 id="guestTitle"></h2>

<div id="orderList"></div>

<div
class="total"
id="guestTotal">
</div>

</div>

<button
style="background:#666"
onclick="back()">

⬅ Zurück 
</button>

    
<button
style="background:#1976d2"
onclick="payGuest()">

💰 Gast abrechnen

</button>   
<h3>🍺 Getränke</h3>
<div class="menu-grid">

<button onclick="addOrder('Bier',4.90)">🍺 August 4,90 €</button>
<button onclick="addOrder('Weizen',4.90)">🍺 Schussen 4,90 €</button>
<button onclick="addOrder('Radler',4.90)">🍺 Radler 4,90 €</button>
<button onclick="addOrder('Cola/Fanta/Spezi',4.50)">🥤 Cola/Fanta/Spezi 4,50 €</button>
<button onclick="addOrder('Weizen',4.90)">🥤 Weizen 4,90 €</button>
<button onclick="addOrder('Wasser groß',3.50)">💧 Wasser groß 3,50 €</button>
<button onclick="addOrder('Weinschorle',4.90)">🍷 Weinschorle 4,50 €</button>

</div>

<h3>🍽️ Speisen</h3>
<div class="menu-grid">

<button onclick="addOrder('Currywurst',5.00)">Currywurst 5,00 €</button>
<button onclick="addOrder('Wurstsalat',9.50)">🥗 Wurstsalat 9,50 €</button>
<button onclick="addOrder('Schweizer Wurstsalat',10.50)">🥗 Schweizer Wurstsalat 10,50 €</button>
<button onclick="addOrder('Flammkuchen',11.90)">🍕 Flammkuchen 11,90 €</button>
<button onclick="addOrder('Pommes',4.50)">🍟 Pommes 4,50 €</button>
<button onclick="addOrder('Schnitzel',14.90)">🥩 Schnitzel 14,90 €</button>

</div>

</div>

</div>

<script>

let guests =
JSON.parse(
localStorage.getItem('guests')
) || [];

let currentGuest = null;

function save(){

localStorage.setItem(
'guests',
JSON.stringify(guests)
);

}

function escapeHtml(value){
return String(value ?? '').replace(/[&<>"']/g, character => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
})[character]);
}

function createGuest() {

    const input =
        document
        .getElementById('guestInfo')
        .value
        .trim();

    if (input === '') {
        alert('Nummer eingeben');
        return;
    }

    const parts = input.split(/\s+/);
    const card = parts.shift();
    const name = parts.join(' ');
    const table =
        document
        .getElementById('tableNumber')
        .value;

    if (guests.find(g => g.card === card)) {
        alert('Karte bereits aktiv');
        return;
    }

    guests.push({
        card,
        name,
        table,
        orders: []
    });

    save();
    document.getElementById('guestInfo').value = '';
    renderGuests();
}

function renderGuests(){

const filter =
document
.getElementById('searchCard')
.value
.toLowerCase();

let html='';
 guests
.filter(g =>
(g.card + ' ' + (g.name || ''))
.toLowerCase()
.includes(filter)
)
.forEach(g => {

let total = 0;

(g.orders || []).forEach(o=>{
    total += Number(o.total) || 0;
});

html += `
<div
class="card guest-card"
data-card="${escapeHtml(g.card)}"
onclick="openGuest(this.dataset.card)">

<b>${escapeHtml(g.card)}${g.name ? ` ${escapeHtml(g.name)}` : ''}<br>
${escapeHtml(g.table)}<br><br>
Offen: ${total.toFixed(2)} €

</div>
`;

});

document
.getElementById('guestCards')
.innerHTML = html;

}

function openGuest(card){

currentGuest =
guests.find(
g => g.card === card
);

if (!currentGuest) return;

document
.getElementById('guestList')
.classList
.add('hidden');

document
.getElementById('guestView')
.classList
.remove('hidden');

refreshGuest();

}

function refreshGuest(){

let html='';
let total=0;

(currentGuest.orders || []).forEach(order => {
    const uhrzeit = order.time
        ? new Date(order.time).toLocaleTimeString('de-DE', {
            hour: '2-digit',
            minute: '2-digit'
        })
        : '';

    html += `
    <div class="order-row">
        <span>
            ${order.name}<br>
            ${order.qty} × ${order.unitPrice.toFixed(2)} €<br>
            <small>${uhrzeit}</small>
        </span>
        <b>${order.total.toFixed(2)} €</b>
    </div>
    `;

    total += order.total;
});

const guestName = currentGuest.name
    ? ` ${escapeHtml(currentGuest.name)}`
    : '';

document
.getElementById('guestTitle')
.innerHTML =
`${escapeHtml(currentGuest.card)}${guestName}<br>${escapeHtml(currentGuest.table)}`;
document
.getElementById('orderList')
.innerHTML =
html || 'Keine Bestellungen';

document
.getElementById('guestTotal')
.innerHTML =
'Gesamt: ' +
total.toFixed(2) +
' €';

}

function addOrder(name, price) {
    let qty = prompt('Menge', '1');

    if (qty === null) return;

    qty = parseInt(qty);

    if (isNaN(qty) || qty < 1) {
        alert('Ungültige Menge');
        return;
    }

    currentGuest.orders.push({
        name: name,
        qty: qty,
        unitPrice: price,
        total: qty * price,
        time: new Date().toISOString()
    });

    save();
    refreshGuest();
}

function payGuest(){

if(
!confirm(
'Gast abrechnen?'
)
){
return;
}

guests =
guests.filter(
g =>
g.card !==
currentGuest.card
);

save();

back();

}

function back(){

document
.getElementById('guestView')
.classList
.add('hidden');

document
.getElementById('guestList')
.classList
.remove('hidden');

renderGuests();

}

renderGuests();

</script>

</body>
</html>
