.filter(g =>
g.card
.toLowerCase()
.includes(filter)
)
.forEach(g => {

let total = 0;

g.orders.forEach(o=>{
total += o.total;
});

html += `
<div
class="card"
onclick="openGuest('${g.card}')">

<b>Karte ${g.card}</b><br>

${g.table}<br><br>

Offen:
${total.toFixed(2)} €

</div>
`;

});

document
.getElementById('guestCards')
.innerHTML = html;

}

function openGuest(card){

currentGuest =
guests.find(
g => g.card === card
);

document
.getElementById('guestList')
.classList
.add('hidden');

document
.getElementById('guestView')
.classList
.remove('hidden');

refreshGuest();

}

function refreshGuest(){

let html='';
let total=0;

currentGuest.orders.forEach(order=>{

html += `
<div class="order-row">

<span>
${order.name}<br>
${order.qty}
x
${order.unitPrice.toFixed(2)} €
</span>

<b>
${order.total.toFixed(2)} €
</b>

</div>
`;

total += order.total;

});

document
.getElementById('guestTitle')
.innerHTML =
`Karte ${currentGuest.card}<br>${currentGuest.table}`;

document
.getElementById('orderList')
.innerHTML =
html || 'Keine Bestellungen';

document
.getElementById('guestTotal')
.innerHTML =
'Gesamt: ' +
total.toFixed(2) +
' €';

}

function addOrder(name,price){

let qty =
prompt(
'Menge',
'1'
);

if(qty === null)
return;

qty =
parseInt(qty);

if(
isNaN(qty)
||
qty < 1
){
alert('Ungültige Menge');
return;
}

currentGuest.orders.push({

name:name,

qty:qty,

unitPrice:price,

total:
qty * price

});

save();

refreshGuest();

}

function payGuest(){

if(
!confirm(
'Gast abrechnen?'
)
){
return;
}

guests =
guests.filter(
g =>
g.card !==
currentGuest.card
);

save();

back();

}

function back(){

document
.getElementById('guestView')
.classList
.add('hidden');

document
.getElementById('guestList')
.classList
.remove('hidden');

renderGuests();

}

renderGuests();

</script>
